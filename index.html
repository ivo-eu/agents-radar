// ── Routing ──
function parseRoute() {
  const [a, b] = location.hash.slice(1).split('/');
  if (a === 'favorites') return { type: 'favorites', kind: FAV_KINDS.includes(b) ? b : 'all' };
  if (/^\d{4}-\d{2}-\d{2}$/.test(a) && b) return { type: 'report', date: a, report: b };
  return null;
}
function readFocus() {
  const f = new URLSearchParams(location.search).get('focus');
  if (f) pendingFocus = f;
}
function reportExists(date, report) {
  return manifestDates.some((d) => d.date === date && d.reports.includes(report));
}
async function handleRoute() {
  readFocus();
  const route = parseRoute();
  if (route?.type === 'favorites') { renderFavoritesView(route.kind); return; }
  if (route?.type === 'report' && reportExists(route.date, route.report)) {
    if (`${route.date}/${route.report}` === currentKey) applyPendingFocus();
    else await loadReport(route.date, route.report, false);
    return;
  }
  const first = manifestDates[0];
  if (first?.reports?.length) {
    history.replaceState(null, '', `#${first.date}/${first.reports[0]}`);
    await loadReport(first.date, first.reports[0], false);
  }
}

// ── State ──
let currentKey = null;
let manifestDates = [];
const searchIndex = new Map();
const loadedSearchMonths = new Set();
let searchMonths = [];
let searchGeneration = 0;
let searchQuery = '';
let searchDebounce = null;
const BRIDGE_URL = 'http://127.0.0.1:4399';
const BRIDGE_TOKEN_KEY = 'radar-bridge-token';
let bridgeToken = localStorage.getItem(BRIDGE_TOKEN_KEY) || '';
let bridgeConnected = false;
let bridgeSyncing = false;

// ── Favorites state (Phase 1 bookmarks + Phase 2 sync) ──
const FAV_KEY = 'radar-favorites';
const FAV_HIDDEN_KEY = 'radar-favorites-hidden'; // legacy local tombstones (migrated to deleted_at)
const FAV_SYNCED_KEY = 'radar-favorites-synced-at';
const FAV_KINDS = ['report', 'link', 'excerpt'];
const FAV_KIND_LABEL = { report: '整篇', link: '链接', excerpt: '段落' };
// Single source of truth for "a favoritable block" — selection and decoration
// MUST use the same selector so every excerpt block gets a resolvable anchor.
const FAV_BLOCK_SELECTOR = 'p, blockquote, li, td, h2, h3, h4';
const FAV_SYNC_DEBOUNCE = 5000;
let favoriteStore = { version: 1, updated_at: '', items: [] };
let favoriteIds = new Set(); // alive ids only (no deleted_at)
let currentFavFilter = null; // null = report view; else 'all'|'report'|'link'|'excerpt'
let pendingFocus = null;
// Phase 2 sync: tombstones live in favoriteStore.items as items with deleted_at.
let favSyncedAt = localStorage.getItem(FAV_SYNCED_KEY) || '';
let favSyncing = false;
let favSyncError = '';
let favSyncTimer = null;
// Phase 3 favorites-view filters + per-card expand state (in-memory).
let favSearchQuery = '';
let favSourceDateFilter = '';
let favTagFilter = new Set();   // multi-select; an item must contain ALL selected tags (AND)
let favExpanded = new Set();    // ids of expanded cards

// Items the user can still see — tombstones (deleted_at) excluded.
function aliveItems() { return favoriteStore.items.filter((it) => !it.deleted_at); }

// Tie-break key for equal edited_at (mirror of Go tagsNoteKey, byte-for-byte).
// The \x01 separator matches Go's; comparison MUST use UTF-8 byte order
// (favKeyGreaterEq), not JS's default UTF-16 compare.
function favTagsNoteKey(it) { return ((it && it.tags) || []).join('\n') + '\x01' + ((it && it.note) || ''); }

// Compare two strings by UTF-8 byte order → true when a >= b. Mirrors Go's
// string >= (UTF-8 bytes). JS's own >= compares UTF-16 code units, which
// disagrees with Go for non-BMP chars (emoji vs U+FFFF), so the LWW tie-break
// must encode to UTF-8 first or the two ends pick different winners.
const favTextEncoder = new TextEncoder();
function favKeyGreaterEq(a, b) {
  const ab = favTextEncoder.encode(a || ''), bb = favTextEncoder.encode(b || '');
  const n = Math.min(ab.length, bb.length);
  for (let i = 0; i < n; i++) {
    if (ab[i] !== bb[i]) return ab[i] > bb[i];
  }
  return ab.length >= bb.length;
}

// Parse a tags input string ("#a, b  c") → clean unique tag array.
function parseTagsInput(str) {
  const seen = new Set();
  const out = [];
  for (let t of String(str || '').split(/[,\s]+/)) {
    t = t.replace(/^#+/, '').trim();
    if (!t) continue;
    const cp = [...t]; // count by Unicode code point (mirror Go rune cap of 32)
    if (cp.length > 32) t = cp.slice(0, 32).join('');
    if (seen.has(t)) continue;
    seen.add(t);
    out.push(t);
    if (out.length >= 20) break;
  }
  return out;
}

function loadLocalFavorites() {
  try {
    const raw = JSON.parse(localStorage.getItem(FAV_KEY) || 'null');
    if (raw && Array.isArray(raw.items)) return raw;
  } catch (_) { /* corrupt → ignore */ }
  return { version: 1, updated_at: '', items: [] };
}

function loadHiddenFavorites() {
  try {
    const raw = JSON.parse(localStorage.getItem(FAV_HIDDEN_KEY) || 'null');
    if (Array.isArray(raw)) return raw;
  } catch (_) { /* corrupt → ignore */ }
  return [];
}

function persistFavorites() {
  favoriteStore.updated_at = new Date().toISOString();
  localStorage.setItem(FAV_KEY, JSON.stringify(favoriteStore));
  favoriteIds = new Set(aliveItems().map((it) => it.id));
}

// ── merge engine (JS mirror of the Go Bridge mergeFavorites; see main.go) ──
function favPreferNonEmpty(a, b) { return (a && String(a).trim()) ? a : b; }
function favEarliest(a, b) { if (!a) return b || ''; if (!b) return a; return a < b ? a : b; }
function favLatest(a, b) { return (a || '') > (b || '') ? (a || '') : (b || ''); }
function mergeSource(a, b) {
  a = a || {}; b = b || {};
  const out = {
    date: favPreferNonEmpty(b.date, a.date) || '',
    report: favPreferNonEmpty(b.report, a.report) || '',
    label: favPreferNonEmpty(b.label, a.label) || '',
    url: favPreferNonEmpty(b.url, a.url) || '',
    anchor: favPreferNonEmpty(b.anchor, a.anchor) || '',
  };
  // anchors: every block a multi-block excerpt spans. Prefer the newer (b) list,
  // fall back to a; omit when empty so it stays out of the JSON (matches Go).
  const anchors = (b.anchors && b.anchors.length) ? b.anchors : a.anchors;
  if (anchors && anchors.length) out.anchors = anchors;
  return out;
}
// Combine two records of the same id; b is the newer fold input. created_at keeps
// the earliest (stable sort key); revived_at keeps the latest re-favorite event;
// life/death uses max(created_at, revived_at) vs max(deleted_at) so a stale
// tombstone can't re-kill an item revived after it. Mirror of Go mergeTwo.
function mergeItem(a, b) {
  const out = { ...a };
  out.kind = a.kind || b.kind || '';
  for (const f of ['title', 'url', 'site', 'excerpt', 'section']) {
    out[f] = favPreferNonEmpty(b[f], a[f]) || '';
  }
  out.source = mergeSource(a.source, b.source);
  // tags/note: field-level last-writer-wins by edited_at (whole tag set replaced).
  // On a tie, pick the side whose key is greater in UTF-8 byte order — deterministic
  // AND order-independent, so browser-load and Bridge-sync agree even for non-ASCII
  // (favKeyGreaterEq matches Go's byte compare; plain >= would diverge on emoji).
  const ae = a.edited_at || '', be = b.edited_at || '';
  let pick;
  if (ae > be) pick = a;
  else if (be > ae) pick = b;
  else pick = favKeyGreaterEq(favTagsNoteKey(a), favTagsNoteKey(b)) ? a : b;
  out.tags = pick.tags; out.note = pick.note;
  out.edited_at = favLatest(a.edited_at, b.edited_at);
  if (!out.edited_at) delete out.edited_at;
  if (!out.tags || !out.tags.length) delete out.tags;
  if (!out.note) delete out.note;
  out.created_at = favEarliest(a.created_at, b.created_at);
  out.revived_at = favLatest(a.revived_at, b.revived_at);
  const delTime = favLatest(a.deleted_at, b.deleted_at);
  const aliveTime = favLatest(favLatest(a.created_at, b.created_at), out.revived_at);
  out.deleted_at = (delTime && (!aliveTime || aliveTime <= delTime)) ? delTime : '';
  if (!out.revived_at) delete out.revived_at;
  return out;
}

// Merge local bookmarks, legacy tombstones, and a published favorites.json.
// Tombstones (deleted_at) are kept so cross-device removals do not resurrect.
async function loadFavorites() {
  const local = loadLocalFavorites();
  const byId = new Map();
  const fold = (it) => {
    if (!it || !it.id) return;
    byId.set(it.id, byId.has(it.id) ? mergeItem(byId.get(it.id), it) : it);
  };
  local.items.forEach(fold);
  // Migrate legacy local-only tombstones to weak (epoch) deleted_at items, so a
  // newer real re-add anywhere still overrides them.
  loadHiddenFavorites().forEach((id) => {
    if (typeof id === 'string') fold({ id, kind: '', created_at: '', deleted_at: '1970-01-01T00:00:01.000Z', source: {} });
  });
  try {
    const res = await fetch('./favorites.json', { cache: 'no-store' });
    if (res.ok) {
      const remote = await res.json();
      (remote.items || []).forEach(fold);
    }
  } catch (_) { /* not published yet / offline */ }
  favoriteStore = { version: 1, updated_at: local.updated_at, items: [...byId.values()] };
  favoriteIds = new Set(aliveItems().map((it) => it.id));
}

// ── Phase 2 sync client (debounced, seamless; SYNC button is a fallback) ──
// Pending = any item whose latest activity (created/deleted) is newer than the
// last successful push.
function favLastActivity(it) {
  // Newest of first-favorite / revive / edit / delete — the item's latest change.
  return favLatest(favLatest(it.created_at, it.revived_at), favLatest(it.edited_at, it.deleted_at));
}
function pendingFavCount() {
  return favoriteStore.items.filter((it) => {
    const ts = favLastActivity(it);
    return ts && ts > favSyncedAt;
  }).length;
}
function scheduleFavSync() {
  updateBridgeButtons();
  if (!bridgeConnected) return; // stays pending; flushed on connect
  clearTimeout(favSyncTimer);
  favSyncTimer = setTimeout(() => void flushFavSync(false), FAV_SYNC_DEBOUNCE);
}
// Fold an authoritative server set onto the current store WITHOUT clobbering
// edits the user made while the request was in flight: merge by id (mergeItem
// keeps the newest event on each side), so an in-flight add/remove survives.
function reconcileWithServer(serverItems) {
  const byId = new Map();
  const fold = (it) => {
    if (!it || !it.id) return;
    byId.set(it.id, byId.has(it.id) ? mergeItem(byId.get(it.id), it) : it);
  };
  serverItems.forEach(fold);          // authoritative base
  favoriteStore.items.forEach(fold);  // current store may hold in-flight changes
  favoriteStore.items = [...byId.values()];
  localStorage.setItem(FAV_KEY, JSON.stringify(favoriteStore));
  favoriteIds = new Set(aliveItems().map((it) => it.id));
}
async function flushFavSync(showResult = false) {
  if (favSyncing || !bridgeConnected) return;
  if (!showResult && !pendingFavCount()) return;
  clearTimeout(favSyncTimer);
  favSyncing = true; favSyncError = ''; updateBridgeButtons();
  // Snapshot what we are about to confirm. The watermark is the newest activity
  // IN THE SNAPSHOT; favSyncedAt may only advance to it — never to "now" — so any
  // change made while the request is in flight stays pending and re-syncs.
  const snapshot = favoriteStore.items.map((it) => ({ ...it }));
  let ackWatermark = '';
  for (const it of snapshot) ackWatermark = favLatest(ackWatermark, favLastActivity(it));
  try {
    const res = await bridgeFetch('/api/favorites/sync', {
      method: 'POST',
      body: JSON.stringify({ items: snapshot }),
    });
    if (Array.isArray(res.items)) reconcileWithServer(res.items);
    // A sync is only fully done when BOTH products succeeded: GitHub push AND the
    // SecondBrain markdown. A vault failure is a partial success — keep it pending
    // (do NOT advance the watermark) so the auto-retry actually re-sends and heals.
    const vaultFailed = res.pushed && res.vault_written === false;
    if (res.pushed && !vaultFailed) {
      // Advance only to the snapshot's watermark, not the response time.
      favSyncedAt = favLatest(favSyncedAt, ackWatermark);
      localStorage.setItem(FAV_SYNCED_KEY, favSyncedAt);
      favSyncError = '';
    } else if (vaultFailed) {
      favSyncError = res.vault_error || 'SecondBrain 写入失败';
    } else {
      favSyncError = res.error || '待推送 GitHub';
    }
    renderFavNav();
    if (currentFavFilter) renderFavoritesView(currentFavFilter, false);
    if (showResult) {
      if (vaultFailed) alert(`GitHub 已同步，但 SecondBrain 写入失败：${res.vault_error || ''}`);
      else if (res.pushed) alert(`收藏已同步（${res.alive ?? aliveItems().length} 条）`);
      else alert(`已合并到本机，待推送：${res.error || ''}`);
    }
  } catch (e) {
    favSyncError = e.message;
    if (showResult) alert(`收藏同步失败：${e.message}`);
  } finally {
    favSyncing = false;
    updateBridgeButtons();
    // If the user changed favorites while we were syncing, or push failed,
    // schedule another flush. (Re-checks pending; no-op when fully synced.)
    if (bridgeConnected && (pendingFavCount() || favSyncError)) {
      clearTimeout(favSyncTimer);
      favSyncTimer = setTimeout(() => void flushFavSync(false), favSyncError ? 30000 : FAV_SYNC_DEBOUNCE);
    }
  }
}
// Best-effort flush when the tab is hidden/closed (keepalive survives unload).
function favSyncBeacon() {
  if (!bridgeConnected || !bridgeToken || !pendingFavCount()) return;
  try {
    fetch(`${BRIDGE_URL}/api/favorites/sync`, {
      method: 'POST', mode: 'cors', keepalive: true,
      headers: { Authorization: `Bearer ${bridgeToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: favoriteStore.items }),
    });
  } catch (_) { /* best effort */ }
}

const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');
const bridgeBtn = document.getElementById('bridgeBtn');
const syncBtn = document.getElementById('syncBtn');

function setSearchStatus(text) {
  searchStatus.textContent = text || '';
}

function applyDateSearch(query, loading = false) {
  const needle = query.trim().toLowerCase();
  let hits = 0;

  // Search only spans the daily section; weekly/monthly use their own per-week navigation.
  document.querySelectorAll('.daily-section .date-group').forEach((grp) => {
    const hdr = grp.querySelector('.date-hdr');
    if (!hdr) return;

    if (!needle) {
      hdr.classList.remove('search-hit');
      return;
    }

    const text = searchIndex.get(grp.dataset.date) || '';
    const matched = text.includes(needle);
    hdr.classList.toggle('search-hit', matched);
    if (matched) hits += 1;
  });

  if (!needle) {
    setSearchStatus('');
  } else if (loading) {
    setSearchStatus(`已匹配 ${hits} 天，正在加载更多月份…`);
  } else {
    setSearchStatus(`匹配 ${hits} 天`);
  }
}

async function loadSearchManifest() {
  if (searchMonths.length) return;
  const res = await fetch('./search-index/manifest.json');
  if (!res.ok) throw new Error('搜索索引清单不可用');
  const data = await res.json();
  searchMonths = data.months || [];
}

async function searchAllMonths(query, generation) {
  const needle = query.trim().toLowerCase();
  if (!needle) return;
  try {
    await loadSearchManifest();
    for (const month of searchMonths) {
      if (generation !== searchGeneration || !searchQuery.trim()) return;
      if (!loadedSearchMonths.has(month)) {
        applyDateSearch(needle, true);
        const res = await fetch(`./search-index/${month}.json`);
        if (res.ok) {
          const data = await res.json();
          Object.entries(data.dates || {}).forEach(([date, text]) => searchIndex.set(date, text));
        }
        loadedSearchMonths.add(month);
      }
      applyDateSearch(needle, loadedSearchMonths.size < searchMonths.length);
    }
    if (generation === searchGeneration) applyDateSearch(needle, false);
  } catch (error) {
    setSearchStatus(`搜索索引加载失败：${error.message}`);
  }
}

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  searchGeneration += 1;
  const generation = searchGeneration;
  clearTimeout(searchDebounce);
  if (!searchQuery.trim()) {
    applyDateSearch('');
    return;
  }
  applyDateSearch(searchQuery, true);
  searchDebounce = setTimeout(() => searchAllMonths(searchQuery, generation), 180);
});

function consumeBridgeToken() {
  const url = new URL(location.href);
  const token = url.searchParams.get('bridge_token');
  if (!token) return;
  bridgeToken = token;
  localStorage.setItem(BRIDGE_TOKEN_KEY, token);
  url.searchParams.delete('bridge_token');
  history.replaceState(null, '', url.pathname + url.search + url.hash);
}

async function bridgeFetch(path, options = {}) {
  if (!bridgeToken) throw new Error('本机尚未配对');
  const headers = new Headers(options.headers || {});
  headers.set('Authorization', `Bearer ${bridgeToken}`);
  if (options.body) headers.set('Content-Type', 'application/json');
  const res = await fetch(`${BRIDGE_URL}${path}`, { ...options, headers, mode: 'cors' });
  if (res.status === 401) {
    bridgeToken = '';
    localStorage.removeItem(BRIDGE_TOKEN_KEY);
    throw new Error('本机配对已失效');
  }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `HTTP ${res.status}`);
  }
  return res.json();
}

function updateBridgeButtons(message) {
  bridgeBtn.classList.toggle('connected', bridgeConnected);
  const pending = pendingFavCount();
  let label = bridgeConnected ? 'SecondBrain 已连接' : '本机未连接';
  if (favSyncing) label += ' · 同步收藏中…';
  else if (pending) label += ` · ${pending} 条待同步`;
  bridgeBtn.textContent = label;
  let title = message || (bridgeConnected ? '本地 Bridge 已连接' : '点击连接本地 SecondBrain');
  if (favSyncError) title = `收藏未同步：${favSyncError}`;
  else if (pending && !bridgeConnected) title = `${pending} 条收藏待同步，连接后自动上传`;
  bridgeBtn.title = title;
  syncBtn.disabled = !bridgeConnected || bridgeSyncing || favSyncing;
  syncBtn.classList.toggle('busy', bridgeSyncing || favSyncing);
  syncBtn.textContent = (bridgeSyncing || favSyncing) ? '同步中…' : 'SYNC';
}

function connectBridge() {
  const returnUrl = location.origin + location.pathname;
  location.href = `${BRIDGE_URL}/pair?return=${encodeURIComponent(returnUrl)}`;
}

async function refreshBridgeStatus(triggerSync = false) {
  if (!bridgeToken) {
    bridgeConnected = false;
    updateBridgeButtons();
    return;
  }
  try {
    const status = await bridgeFetch('/api/status');
    bridgeConnected = true;
    bridgeSyncing = !!status.syncing;
    // Adopt the Bridge-persisted favorites error (e.g. a prior vault-write failure)
    // so the warning survives a page refresh. Don't clobber an in-flight local error.
    if (!favSyncing && !favSyncError && status.favorites_error) {
      favSyncError = status.favorites_error;
    }
    updateBridgeButtons(status.last_error || `上次同步：${status.last_sync || '尚未同步'}`);
    if (triggerSync && !bridgeSyncing) void syncBridge(false);
    // pendingFavCount() stays > 0 after a vault failure (watermark not advanced),
    // so this also drives the vault-write retry — no separate trigger needed.
    if (pendingFavCount()) void flushFavSync(false);
  } catch (error) {
    bridgeConnected = false;
    updateBridgeButtons(error.message);
  }
}

async function syncBridge(showResult = true) {
  if (!bridgeConnected) {
    connectBridge();
    return;
  }
  bridgeSyncing = true;
  updateBridgeButtons();
  try {
    const result = await bridgeFetch('/api/sync', { method: 'POST' });
    if (showResult) alert(`同步完成：新增或更新 ${result.updated} 个文件，跳过 ${result.skipped} 个文件。`);
  } catch (error) {
    if (showResult) alert(`同步失败：${error.message}`);
  } finally {
    bridgeSyncing = false;
    updateBridgeButtons();
  }
}

function currentSource() {
  const [date = '', report = ''] = (currentKey || '').split('/');
  return {
    date,
    report,
    label: LABELS[report] || report,
    url: `${location.origin}${location.pathname}#${currentKey || ''}`,
  };
}

function nearestSection(element) {
  // If the block itself is a heading, it IS the section — don't climb to the
  // PARENT heading (that turned an H4-anchored excerpt's title into the H3 above).
  if (element && /^H[2-4]$/.test(element.tagName || '')) return element.textContent.trim();
  let cursor = element;
  while (cursor) {
    let sibling = cursor.previousElementSibling;
    while (sibling) {
      if (/^H[2-4]$/.test(sibling.tagName)) return sibling.textContent.trim();
      sibling = sibling.previousElementSibling;
    }
    cursor = cursor.parentElement;
    if (!cursor?.classList?.contains('md')) break;
  }
  return '';
}

function cleanExcerpt(element) {
  const clone = element.cloneNode(true);
  clone.querySelectorAll('.fav-report-btn').forEach((node) => node.remove());
  return clone.textContent.replace(/\s+/g, ' ').trim().slice(0, 1800);
}

// Serialize a DOM fragment to plain text while turning <a href> into Markdown
// [text](url) so a favorited excerpt keeps its clickable links (both in the
// vault note and in the web favorites view). Whitespace is collapsed like
// cleanExcerpt; link text/URLs are preserved verbatim.
function fragmentToMarkdown(fragment) {
  let out = '';
  const walk = (node) => {
    if (node.nodeType === 3) { out += node.nodeValue; return; }
    if (node.nodeType !== 1) return;
    if (node.classList && node.classList.contains('fav-report-btn')) return;
    if (node.tagName === 'A' && node.getAttribute('href')) {
      const url = node.getAttribute('href');
      const text = (node.textContent || '').replace(/\s+/g, ' ').trim();
      out += `[${text || url}](${url})`;
      return;
    }
    node.childNodes.forEach(walk);
    if (node.tagName === 'BR') out += ' ';
  };
  fragment.childNodes.forEach(walk);
  // Collapse whitespace, but keep the markdown-link brackets intact.
  return out.replace(/\s+/g, ' ').trim().slice(0, 1800);
}

// Markdown-rich excerpt for the live selection: keeps <a> links, falls back to
// plain text when the range carries no markup.
function selectionExcerptMarkdown() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return '';
  const md = fragmentToMarkdown(sel.getRangeAt(0).cloneContents());
  return md || normalizeDisplayText(sel.toString());
}

// ── stable IDs: SHA-256 hex over canonical strings (must match Go Bridge) ──
// Mirror of bridge normalizeFavoriteURL: lowercase scheme+host, drop fragment,
// strip utm_*/ref/source params, stable-sort query, collapse root path "/" → "".
// Go uses url.String() + url.Values.Encode(); we reproduce that byte-for-byte.
function normalizeUrl(href) {
  let u;
  try {
    u = new URL((href || '').trim(), location.href);
  } catch (_) {
    return (href || '').trim();
  }
  if (u.protocol !== 'http:' && u.protocol !== 'https:') return (href || '').trim();
  u.protocol = u.protocol.toLowerCase();
  u.hostname = u.hostname.toLowerCase();
  u.hash = '';
  for (const key of [...u.searchParams.keys()]) {
    const lower = key.toLowerCase();
    if (lower.startsWith('utm_') || lower === 'ref' || lower === 'source') {
      u.searchParams.delete(key);
    }
  }
  u.searchParams.sort();
  // Go's url.Values.Encode() encodes spaces as '+' (same as URLSearchParams),
  // but URLSearchParams also percent-encodes a handful of chars Go leaves raw.
  const query = encodeGoQuery(u.searchParams);
  let path = u.pathname;
  if (path === '/') path = '';
  return `${u.protocol}//${u.host}${path}${query ? '?' + query : ''}`;
}

// Reproduce Go url.Values.Encode(): RFC3986-ish escaping where space→'+',
// matching net/url.QueryEscape so JS and Go derive the same favorite ID.
function encodeGoQuery(params) {
  const parts = [];
  for (const [k, v] of params) {
    parts.push(goQueryEscape(k) + '=' + goQueryEscape(v));
  }
  return parts.join('&');
}
function goQueryEscape(s) {
  let out = '';
  for (const ch of s) {
    if (/[A-Za-z0-9\-_.~]/.test(ch)) { out += ch; continue; }
    if (ch === ' ') { out += '+'; continue; }
    for (const byte of new TextEncoder().encode(ch)) {
      out += '%' + byte.toString(16).toUpperCase().padStart(2, '0');
    }
  }
  return out;
}

// Mirror of bridge normalizeText: collapse whitespace, trim, lowercase.
// Used ONLY for ID hashing — never for display (it discards case).
function normalizeText(text) {
  return (text || '').replace(/\s+/g, ' ').trim().toLowerCase();
}
// Display/length helper: collapse whitespace + trim, but keep original case.
function normalizeDisplayText(text) {
  return (text || '').replace(/\s+/g, ' ').trim();
}
async function sha256Hex(input) {
  const data = new TextEncoder().encode(input);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function favKeyString(kind, parts) {
  if (kind === 'report') return `report\n${parts.date}\n${parts.report}`;
  if (kind === 'link') return `link\n${normalizeUrl(parts.url)}`;
  return `excerpt\n${parts.date}\n${parts.report}\n${normalizeText(parts.excerpt)}`;
}
function favId(kind, parts) {
  return sha256Hex(favKeyString(kind, parts));
}

// Content-derived locator for the DOM block that contains an excerpt.
// Independent of the user's selected sub-string, so the same block always
// resolves to the same anchor across re-renders — used for highlight + jump-back.
// (Local-only in Phase 1; lives under source.anchor.)
function blockAnchorId(date, report, blockText) {
  return sha256Hex(`block\n${date}\n${report}\n${normalizeText(blockText)}`);
}

function siteOf(href) {
  try { return new URL(href, location.href).hostname; } catch (_) { return ''; }
}

// ── add / remove / toggle (localStorage + debounced Bridge sync) ──
function addFavorite(item) {
  const existing = favoriteStore.items.find((it) => it.id === item.id);
  if (existing) {
    if (!existing.deleted_at) return false; // already alive
    // Revive a tombstone: refresh content, keep the original created_at (sort key),
    // stamp revived_at = now so this re-favorite survives a stale remote tombstone.
    const firstCreated = existing.created_at || item.created_at;
    Object.assign(existing, item, {
      created_at: firstCreated,
      revived_at: new Date().toISOString(),
      deleted_at: '',
    });
  } else {
    favoriteStore.items.push(item);
  }
  persistFavorites();
  renderFavNav();
  if (currentFavFilter) renderFavoritesView(currentFavFilter, false);
  scheduleFavSync();
  return true;
}
function removeFavorite(id) {
  // Soft-delete: keep a tombstone so the removal syncs and never resurrects.
  const it = favoriteStore.items.find((x) => x.id === id);
  if (it) it.deleted_at = new Date().toISOString();
  persistFavorites();
  renderFavNav();
  scheduleFavSync();
}
function toggleFavorite(item) {
  if (favoriteIds.has(item.id)) { removeFavorite(item.id); return false; }
  addFavorite(item);
  return true;
}

// ── popover (shared by link hover + text selection) ──
let popover = null;
let popoverShowTimer = null;
let popoverHideTimer = null;
function ensurePopover() {
  if (popover) return popover;
  popover = document.createElement('div');
  popover.className = 'fav-popover';
  popover.addEventListener('mousedown', (e) => e.preventDefault()); // keep text selection
  popover.addEventListener('click', () => {
    const action = popover._action;
    hidePopover();
    if (action) action();
  });
  popover.addEventListener('mouseenter', () => clearTimeout(popoverHideTimer));
  popover.addEventListener('mouseleave', () => {
    // Selection bubbles stay until the selection collapses (handled by selectionchange);
    // moving the mouse off them must NOT dismiss. Link-hover bubbles still auto-hide.
    if (popover._sticky) return;
    popoverHideTimer = setTimeout(hidePopover, 140);
  });
  document.body.appendChild(popover);
  return popover;
}
// sticky=true → bubble survives mouseleave (selection bubbles); the caller is
// responsible for hiding it (e.g. on selectionchange collapse). Default false keeps
// the original auto-hide behaviour for link-hover bubbles.
function showPopover(x, y, text, action, sticky = false) {
  ensurePopover();
  popover.textContent = text;
  popover._action = action;
  popover._sticky = sticky;
  popover.style.left = Math.max(8, Math.min(x, window.innerWidth - 120)) + 'px';
  popover.style.top = Math.max(8, y) + 'px';
  popover.classList.add('show');
}
function hidePopover() {
  if (popover) { popover.classList.remove('show'); popover._action = null; popover._sticky = false; }
}

// ── link favorite toggle ──
function toggleLinkFavorite(link, id, url) {
  const source = currentSource();
  const context = link.closest('li, tr, td, p, blockquote') || link.parentElement;
  const nowSaved = toggleFavorite({
    id,
    kind: 'link',
    title: normalizeDisplayText(link.textContent) || siteOf(url),
    url,
    site: siteOf(url),
    excerpt: context ? cleanExcerpt(context) : '',
    section: nearestSection(context || link),
    created_at: new Date().toISOString(),
    source,
  });
  link.classList.toggle('fav-link-saved', nowSaved);
}

function bindLinkHover(link, id, url) {
  link.addEventListener('mouseenter', () => {
    clearTimeout(popoverHideTimer);
    clearTimeout(popoverShowTimer);
    popoverShowTimer = setTimeout(() => {
      const r = link.getBoundingClientRect();
      const saved = favoriteIds.has(id);
      showPopover(r.left, r.top - 32, saved ? '取消收藏链接' : '收藏链接', () => toggleLinkFavorite(link, id, url));
    }, 320);
  });
  link.addEventListener('mouseleave', () => {
    clearTimeout(popoverShowTimer);
    popoverHideTimer = setTimeout(() => { if (!popover?.matches(':hover')) hidePopover(); }, 160);
  });
}

// ── text-selection → favorite the SELECTED TEXT, anchored to its block ──
// Resolve the favoritable block that contains the current selection.
// A selection that spans a <br> or crosses sibling blocks has its
// commonAncestorContainer climb up to the <p> or even the .md <div>, where
// .closest(FAV_BLOCK_SELECTOR) finds nothing. So we resolve the block from the
// selection's START point (always inside a real block), then fall back to the
// end point and finally the common ancestor.
function blockFromNode(node) {
  if (!node) return null;
  if (node.nodeType === 3) node = node.parentElement;
  if (!node || !node.closest) return null;
  if (!node.closest('#content .md')) return null;
  if (node.closest('pre')) return null;
  return node.closest(FAV_BLOCK_SELECTOR) || null;
}
function selectionBlock() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  return (
    blockFromNode(range.startContainer) ||
    blockFromNode(range.endContainer) ||
    blockFromNode(range.commonAncestorContainer)
  );
}
// Every favoritable block the selection touches, in document order. A selection
// of "heading + body" crosses multiple blocks (h4, p, …) — we anchor & highlight
// ALL of them, not just the start block. Falls back to [selectionBlock()].
function selectionBlocks() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return [];
  const range = sel.getRangeAt(0);
  const container = document.querySelector('#content .md');
  if (!container) return [selectionBlock()].filter(Boolean);
  const blocks = [...container.querySelectorAll(FAV_BLOCK_SELECTOR)].filter(
    (b) => !b.closest('pre') && range.intersectsNode(b),
  );
  return blocks.length ? blocks : [selectionBlock()].filter(Boolean);
}
function setupSelectionFavorites() {
  document.addEventListener('mouseup', (e) => {
    if (popover && popover.contains(e.target)) return;
    // Capture selection text + block SYNCHRONOUSLY — clicking the popover can clear
    // the selection, so we must not re-read it later. selectedText (plain) drives
    // the stable ID/hash; excerptMarkdown keeps links for display + the vault note.
    const selectedText = normalizeDisplayText(window.getSelection()?.toString() || '');
    const excerptMarkdown = selectionExcerptMarkdown();
    const blocks = selectionBlocks();
    const block = blocks[0] || selectionBlock();
    if (!block || selectedText.length < 2) { hidePopover(); return; }
    // Show the bubble IMMEDIATELY — defer the sha256 hashes (favId/blockAnchorId)
    // to the click handler, since they're only needed when the user actually saves.
    showPopover(e.clientX + 12, e.clientY - 34, '收藏段落', async () => {
      const source = currentSource();
      // Anchor EVERY block the selection spans (heading + body), in order.
      const anchors = await Promise.all(
        blocks.map((b) => blockAnchorId(source.date, source.report, cleanExcerpt(b))),
      );
      const anchor = anchors[0]; // primary anchor = first block (jump-back target)
      const id = await favId('excerpt', { date: source.date, report: source.report, excerpt: selectedText });
      // Title = heading the selection starts under (or the selection itself).
      const section = nearestSection(block);
      // Selection only ADDS a favorite — removal is handled by hovering the
      // highlighted block (see bindBlockUnfavoriteHover). Re-selecting an
      // already-saved span is a no-op rather than toggling it off.
      if (!favoriteIds.has(id)) {
        addFavorite({
          id,
          kind: 'excerpt',
          title: section || selectedText.slice(0, 60),
          excerpt: excerptMarkdown || selectedText,
          section,
          created_at: new Date().toISOString(),
          source: { ...source, anchor, anchors },
        });
      }
      // Highlight EVERY spanned block while any excerpt still covers it, and bind
      // the hover-to-unfavorite bubble so the just-saved block is removable without
      // waiting for a re-render.
      blocks.forEach((b, i) => {
        b.dataset.favAnchor = anchors[i];
        b.classList.toggle('fav-block-saved', blockHasSavedExcerpt(anchors[i]));
        bindBlockUnfavoriteHover(b);
      });
      window.getSelection()?.removeAllRanges();
    }, true); // sticky: survive mouseleave; only selectionchange/click dismisses it
  });
  // Selection-driven hide: the bubble stays as long as the selection is alive, so
  // scrolling or moving the mouse no longer dismisses it. Only hide once the
  // selection collapses (user clicked elsewhere / started a new selection).
  // Debounced to ignore the transient collapse that fires mid-drag while selecting.
  let selectionHideTimer = null;
  document.addEventListener('selectionchange', () => {
    clearTimeout(selectionHideTimer);
    selectionHideTimer = setTimeout(() => {
      if (window.getSelection()?.isCollapsed) hidePopover();
    }, 50);
  });
}

// A block stays highlighted while ANY excerpt favorite covers its anchor.
// Excerpts may span multiple blocks: source.anchors lists every covered block;
// fall back to the single source.anchor for legacy items saved before that.
function blockHasSavedExcerpt(anchor) {
  if (!anchor) return false;
  return favoriteStore.items.some((it) => {
    if (it.kind !== 'excerpt' || it.deleted_at) return false;
    const anchors = it.source?.anchors;
    return anchors ? anchors.includes(anchor) : it.source?.anchor === anchor;
  });
}

// Remove EVERY excerpt favorite covering this block's anchor. An excerpt may span
// several blocks (source.anchors), so a single anchor can belong to >1 favorite;
// drop them all so the block stops being highlighted.
function removeExcerptsByAnchor(anchor) {
  if (!anchor) return;
  favoriteStore.items.forEach((it) => {
    if (it.kind !== 'excerpt' || it.deleted_at) return;
    const anchors = it.source?.anchors;
    const covers = anchors ? anchors.includes(anchor) : it.source?.anchor === anchor;
    if (covers) removeFavorite(it.id);
  });
}

// Re-sync the highlight class on every anchored block in the current report.
// Used after un-favoriting: a multi-block excerpt (heading + list items) covers
// sibling blocks, so toggling only the hovered block would leave the others lit
// until the next full re-render.
function refreshBlockHighlights() {
  document.querySelectorAll('#content .md [data-fav-anchor]').forEach((b) => {
    b.classList.toggle('fav-block-saved', blockHasSavedExcerpt(b.dataset.favAnchor));
  });
}

// Hovering a highlighted block floats a "取消收藏段落" bubble (mirrors link-hover).
// This is the only way to un-favorite a paragraph; selecting text only adds.
function bindBlockUnfavoriteHover(block) {
  if (block._favUnbind) return; // bind once per element across re-renders
  block._favUnbind = true;
  block.addEventListener('mouseenter', () => {
    const anchor = block.dataset.favAnchor;
    if (!anchor || !blockHasSavedExcerpt(anchor)) return; // not a saved block
    clearTimeout(popoverHideTimer);
    clearTimeout(popoverShowTimer);
    popoverShowTimer = setTimeout(() => {
      const r = block.getBoundingClientRect();
      showPopover(r.left, r.top - 32, '取消收藏段落', () => {
        removeExcerptsByAnchor(block.dataset.favAnchor);
        refreshBlockHighlights(); // a multi-block excerpt covers sibling blocks too
      });
    }, 320);
  });
  block.addEventListener('mouseleave', () => {
    clearTimeout(popoverShowTimer);
    popoverHideTimer = setTimeout(() => { if (!popover?.matches(':hover')) hidePopover(); }, 160);
  });
}

// ── decorate a freshly rendered report ──
async function enhanceFavorites() {
  const container = document.querySelector('#content .md');
  if (!container) return;
  const source = currentSource();

  // 1) whole-report star next to the first <h1>
  const h1 = container.querySelector('h1');
  if (h1 && !h1.querySelector('.fav-report-btn')) {
    const id = await favId('report', source);
    h1.dataset.favoriteId = id;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'fav-report-btn';
    const sync = () => {
      const saved = favoriteIds.has(id);
      btn.textContent = saved ? '★' : '☆';
      btn.classList.toggle('saved', saved);
      btn.title = saved ? '取消收藏整篇报告' : '收藏整篇报告';
      h1.classList.toggle('fav-report-saved', saved);
    };
    btn.onclick = () => {
      toggleFavorite({
        id,
        kind: 'report',
        title: normalizeDisplayText(cleanExcerpt(h1)) || source.label,
        excerpt: '',
        section: '',
        created_at: new Date().toISOString(),
        source,
      });
      sync();
    };
    h1.appendChild(btn);
    sync();
  }

  // 2) links — highlight if saved + hover popover (no persistent star)
  const links = [...container.querySelectorAll('a[href]')].filter((a) => {
    try { return /^https?:$/.test(new URL(a.href, location.href).protocol); } catch (_) { return false; }
  });
  await Promise.all(links.map(async (link) => {
    const url = new URL(link.href, location.href).href;
    const id = await favId('link', { url });
    link.dataset.favoriteId = id;
    link.classList.toggle('fav-link-saved', favoriteIds.has(id));
    bindLinkHover(link, id, url);
  }));

  // 3) blocks — stamp each with its content anchor; highlight when any saved
  //    excerpt favorite points at that anchor (selection popover handles adding).
  const blocks = [...container.querySelectorAll(FAV_BLOCK_SELECTOR)];
  await Promise.all(blocks.map(async (block) => {
    if (block.closest('pre')) return;
    const blockText = cleanExcerpt(block);
    // Headings can anchor an excerpt (heading + body span), so don't skip short
    // ones; only skip tiny non-heading noise blocks.
    const isHeading = /^H[2-4]$/.test(block.tagName);
    if (!isHeading && blockText.length < 8) return;
    if (!blockText) return;
    const anchor = await blockAnchorId(source.date, source.report, blockText);
    block.dataset.favAnchor = anchor;
    block.classList.toggle('fav-block-saved', blockHasSavedExcerpt(anchor));
    bindBlockUnfavoriteHover(block); // hover a highlighted block → 取消收藏段落
  }));
}

bridgeBtn.onclick = connectBridge;
syncBtn.onclick = () => { void syncBridge(true); void flushFavSync(true); };

// ════════════════════════════════════════════════════════════
//  Favorites: sidebar nav + list view + jump-back
// ════════════════════════════════════════════════════════════
function renderFavNav() {
  const favNav = document.getElementById('favNav');
  if (!favNav) return;
  const counts = { all: 0, report: 0, link: 0, excerpt: 0 };
  aliveItems().forEach((it) => { counts.all += 1; if (counts[it.kind] != null) counts[it.kind] += 1; });
  const defs = [['all', '全部收藏'], ['report', '整篇报告'], ['link', '链接'], ['excerpt', '段落']];
  favNav.innerHTML = '';
  defs.forEach(([kind, label]) => {
    const b = document.createElement('button');
    b.className = 'fav-nav-btn' + (currentFavFilter === kind ? ' active' : '');
    const name = document.createElement('span');
    name.textContent = label;
    const cnt = document.createElement('span');
    cnt.className = 'fav-count';
    cnt.textContent = counts[kind];
    b.append(name, cnt);
    b.onclick = () => { location.hash = kind === 'all' ? 'favorites' : `favorites/${kind}`; };
    favNav.appendChild(b);
  });
}

function favTimeGroup(iso) {
  const d = new Date(iso);
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((today - day) / 86400000);
  if (diff <= 0) return '今天收藏';
  if (diff === 1) return '昨天收藏';
  if (diff === 2) return '前天收藏';
  const p = (n) => String(n).padStart(2, '0');
  return `${day.getFullYear()}-${p(day.getMonth() + 1)}-${p(day.getDate())} 收藏`;
}
function favFmtTime(iso) {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s) {
  return (s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function favSafeHttpUrl(url) {
  return /^https?:\/\//i.test(url || '') ? url : '';
}
// Escape HTML, then upgrade Markdown [text](url) into safe clickable anchors so
// a favorited excerpt keeps its links in the favorites view. Runs AFTER esc(),
// so the captured text/URL are already HTML-safe; only http(s) URLs become links.
function escWithLinks(s) {
  return esc(s).replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (whole, text, url) =>
      `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`,
  );
}
// Does an item pass the live search/date/tag filters? (kind is applied at build.)
function favItemMatches(it) {
  if (favSourceDateFilter && (it.source?.date || '') !== favSourceDateFilter) return false;
  if (favTagFilter.size) {
    const tags = new Set(it.tags || []);
    for (const t of favTagFilter) if (!tags.has(t)) return false;
  }
  const q = favSearchQuery.trim().toLowerCase();
  if (q) {
    const hay = [it.title, it.excerpt, it.site, it.note, it.source?.label, it.source?.date, ...(it.tags || [])]
      .filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderFavoritesView(kind, scroll = true) {
  currentFavFilter = kind;
  currentKey = null;
  document.querySelectorAll('.rpt-btn, .lang-btn').forEach((b) => b.classList.remove('active'));
  document.querySelectorAll('.date-hdr.lit, .month-hdr.lit, .wk-month-hdr.lit').forEach((h) => h.classList.remove('lit'));
  renderFavNav();
  document.getElementById('sidebar').classList.remove('open');

  let items = aliveItems();
  if (kind !== 'all') items = items.filter((it) => it.kind === kind);
  items.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

  const titleMap = { all: '全部收藏', report: '整篇报告', link: '链接收藏', excerpt: '段落摘录' };
  const head = `<div class="fav-list-head">★ ${titleMap[kind] || '我的收藏'}</div>` +
    `<div class="fav-list-sub" id="favCount">共 ${items.length} 条 · 按收藏时间倒序</div>`;

  if (!items.length) {
    setContent(`<div class="md fade">${head}<div class="fav-empty">还没有收藏。<br>在日报里收藏整篇报告（标题旁星标）、悬停链接或选中段落试试。</div></div>`);
    if (scroll) document.getElementById('cwrap').scrollTop = 0;
    return;
  }

  // Filter options come from ALL alive favorites (not the kind-filtered subset), so
  // a value selected under one type stays visible and clearable under another (P2-3.1).
  const all = aliveItems();
  const dates = [...new Set(all.map((it) => it.source?.date).filter(Boolean))].sort((a, b) => b.localeCompare(a));
  const allTags = [...new Set(all.flatMap((it) => it.tags || []))].sort();
  const anyFilter = !!(favSearchQuery || favSourceDateFilter || favTagFilter.size);
  let filters = '<div class="fav-filters">' +
    `<input type="search" id="favSearch" placeholder="🔍 搜索收藏…" value="${esc(favSearchQuery)}">` +
    '<select id="favDate"><option value="">全部来源日期</option>' +
    dates.map((d) => `<option value="${esc(d)}"${d === favSourceDateFilter ? ' selected' : ''}>${esc(d)}</option>`).join('') +
    '</select>' +
    (anyFilter ? '<button class="fav-tag-clear" id="favClearAll">清除全部筛选</button>' : '') +
    '</div>';
  if (allTags.length) {
    filters += '<div class="fav-tagbar">' +
      allTags.map((t) => `<button class="fav-tag${favTagFilter.has(t) ? ' active' : ''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('') +
      (favTagFilter.size ? '<button class="fav-tag-clear" id="favTagClear">清空标签</button>' : '') +
      '</div>';
  }

  let html = `<div class="md fade">${head}${filters}`;
  let lastLabel = null;
  items.forEach((it) => {
    const label = favTimeGroup(it.created_at);
    if (label !== lastLabel) { html += `<div class="fav-group-label">${esc(label)}</div>`; lastLabel = label; }
    const badge = FAV_KIND_LABEL[it.kind] || it.kind;
    const srcDate = it.source?.date || '';
    const srcLabel = it.source?.label || it.source?.report || '';
    const expanded = favExpanded.has(it.id);
    const href = it.kind === 'link' ? favSafeHttpUrl(it.url) : '';
    const titleHtml = href
      ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>`
      : `<span>${esc(it.title)}</span>`;

    html += `<div class="fav-card${expanded ? ' expanded' : ''}" data-id="${esc(it.id)}">` +
      `<div class="fav-card-title"><span class="fav-badge">${esc(badge)}</span>${titleHtml}` +
      `<button class="fav-card-toggle" data-act="toggle">${expanded ? '收起' : '展开'}</button></div>`;
    // Always-visible one-line summary so the collapsed card still shows source + time.
    html += `<div class="fav-submeta">来源：${esc(srcDate)}${srcLabel ? ' · ' + esc(srcLabel) : ''} · 收藏 ${esc(favFmtTime(it.created_at))}</div>`;
    if (it.excerpt) html += `<div class="fav-excerpt">${escWithLinks(it.excerpt)}</div>`;
    if (it.tags && it.tags.length) {
      html += '<div class="fav-card-tags">' + it.tags.map((t) => `<span class="fav-card-tag">#${esc(t)}</span>`).join('') + '</div>';
    }
    html += '<div class="fav-detail">';
    if (it.kind === 'link' && it.site) html += `<div class="fav-meta">网站：${esc(it.site)}</div>`;
    if (it.note) html += `<div class="fav-note">${esc(it.note)}</div>`;
    html += '<div class="fav-edit">' +
      `<input class="fav-edit-tags" placeholder="标签（空格或逗号分隔）" value="${esc((it.tags || []).join(' '))}">` +
      `<textarea class="fav-edit-note" placeholder="备注…">${esc(it.note || '')}</textarea>` +
      '<div class="fav-actions"><button class="fav-action" data-act="save">保存</button>' +
      '<button class="fav-action" data-act="canceledit">取消</button></div></div>';
    html += '<div class="fav-actions">' +
      `<button class="fav-action" data-act="goto">${it.kind === 'report' ? '回到报告' : '回到原文'}</button>`;
    if (it.kind === 'link' && favSafeHttpUrl(it.url)) html += '<button class="fav-action" data-act="open">打开外链</button>';
    html += '<button class="fav-action" data-act="edit">编辑</button>' +
      '<button class="fav-action danger" data-act="remove">取消收藏</button></div>';
    html += '</div></div>';
  });
  html += '<div class="fav-empty" id="favNoMatch" style="display:none">没有匹配的收藏。<br><button class="fav-action" id="favClearFilters" style="margin-top:8px">清除全部筛选</button></div>';
  html += '</div>';
  setContent(html);
  if (scroll) document.getElementById('cwrap').scrollTop = 0;

  const clearAllFilters = () => {
    favSearchQuery = ''; favSourceDateFilter = ''; favTagFilter.clear();
    renderFavoritesView(currentFavFilter, false);
  };

  // ── wire header filters (no rebuild on input → keeps focus) ──
  const searchEl = document.getElementById('favSearch');
  if (searchEl) searchEl.addEventListener('input', () => { favSearchQuery = searchEl.value; applyFavFilters(); });
  document.getElementById('favDate')?.addEventListener('change', (e) => { favSourceDateFilter = e.target.value; applyFavFilters(); });
  document.querySelectorAll('.fav-tag').forEach((chip) => chip.addEventListener('click', () => {
    const t = chip.dataset.tag;
    if (favTagFilter.has(t)) favTagFilter.delete(t); else favTagFilter.add(t);
    renderFavoritesView(currentFavFilter, false); // rebuild to refresh chip active states
  }));
  document.getElementById('favTagClear')?.addEventListener('click', () => { favTagFilter.clear(); renderFavoritesView(currentFavFilter, false); });
  document.getElementById('favClearAll')?.addEventListener('click', clearAllFilters);
  document.getElementById('favClearFilters')?.addEventListener('click', clearAllFilters);

  // ── wire cards ──
  document.querySelectorAll('.fav-card').forEach((card) => {
    const item = favoriteStore.items.find((it) => it.id === card.dataset.id);
    if (!item) return;
    const toggle = () => {
      const open = card.classList.toggle('expanded');
      if (open) favExpanded.add(item.id); else favExpanded.delete(item.id);
      card.querySelector('[data-act="toggle"]').textContent = open ? '收起' : '展开';
    };
    card.querySelector('[data-act="toggle"]')?.addEventListener('click', toggle);
    // Click anywhere on a collapsed card to expand — but not on links/buttons/inputs
    // or while selecting text.
    card.addEventListener('click', (e) => {
      if (card.classList.contains('expanded')) return;
      if (e.target.closest('a, button, input, textarea, .fav-edit, .fav-tag')) return;
      if (window.getSelection && String(window.getSelection())) return;
      toggle();
    });
    card.querySelector('[data-act="goto"]')?.addEventListener('click', () => gotoFavorite(item));
    card.querySelector('[data-act="open"]')?.addEventListener('click', () => window.open(item.url, '_blank', 'noopener'));
    card.querySelector('[data-act="edit"]')?.addEventListener('click', () => card.classList.add('editing'));
    card.querySelector('[data-act="canceledit"]')?.addEventListener('click', () => card.classList.remove('editing'));
    card.querySelector('[data-act="save"]')?.addEventListener('click', () => {
      item.tags = parseTagsInput(card.querySelector('.fav-edit-tags').value);
      // Truncate by Unicode code point (mirror Go rune semantics, not UTF-16 units).
      item.note = [...card.querySelector('.fav-edit-note').value.trim()].slice(0, 2000).join('');
      if (!item.tags.length) delete item.tags;
      if (!item.note) delete item.note;
      item.edited_at = new Date().toISOString();
      persistFavorites();
      renderFavNav();
      scheduleFavSync();
      favExpanded.add(item.id);
      renderFavoritesView(currentFavFilter, false);
    });
    card.querySelector('[data-act="remove"]')?.addEventListener('click', () => {
      removeFavorite(item.id);
      renderFavoritesView(currentFavFilter, false);
    });
  });

  applyFavFilters();
}

// Show/hide already-rendered cards per the live filters, hide empty group labels,
// and update the count — without rebuilding (so the search box keeps focus).
function applyFavFilters() {
  const container = document.querySelector('#content .md');
  if (!container) return;
  let visible = 0;
  container.querySelectorAll('.fav-card').forEach((card) => {
    const item = favoriteStore.items.find((it) => it.id === card.dataset.id);
    const ok = item ? favItemMatches(item) : false;
    card.style.display = ok ? '' : 'none';
    if (ok) visible += 1;
  });
  // Hide a group label when every card under it is hidden.
  container.querySelectorAll('.fav-group-label').forEach((label) => {
    let anyVisible = false;
    for (let n = label.nextElementSibling; n && !n.classList.contains('fav-group-label'); n = n.nextElementSibling) {
      if (n.classList.contains('fav-card') && n.style.display !== 'none') { anyVisible = true; break; }
    }
    label.style.display = anyVisible ? '' : 'none';
  });
  const count = document.getElementById('favCount');
  if (count) count.textContent = `共 ${visible} 条 · 按收藏时间倒序`;
  const noMatch = document.getElementById('favNoMatch');
  if (noMatch) noMatch.style.display = visible === 0 ? '' : 'none';
}

function gotoFavorite(item) {
  const date = item.source?.date;
  const report = item.source?.report;
  if (!date || !report) return;
  // Excerpts resolve via their block anchor (the excerpt id is never on the DOM);
  // report/link resolve via the favorite id stamped as data-favorite-id.
  const target = item.kind === 'excerpt' ? item.source?.anchor || item.id : item.id;
  pendingFocus = target;
  history.pushState(null, '', `${location.pathname}?focus=${encodeURIComponent(target)}#${date}/${report}`);
  handleRoute();
}

function applyPendingFocus() {
  const id = pendingFocus;
  pendingFocus = null;
  if (location.search) history.replaceState(null, '', location.pathname + location.hash);
  if (!id) return;
  // Match either a directly-stamped favorite id (report/link) or a block anchor (excerpt).
  const sel = CSS.escape(id);
  const el = document.querySelector(
    `#content [data-favorite-id="${sel}"], #content [data-fav-anchor="${sel}"]`,
  );
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('fav-flash');
  setTimeout(() => el.classList.remove('fav-flash'), 1700);
}

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

async function loadReport(date, report, push = true) {
  const key = `${date}/${report}`;
  if (key === currentKey) return;
  currentKey = key;
  if (currentFavFilter) { currentFavFilter = null; renderFavNav(); }

  if (push) history.pushState(null, '', `#${key}`);

  // Sync sidebar
  document.querySelectorAll('.rpt-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.date-hdr').forEach(h => {
    const grp = h.closest('.date-group');
    const hasActive = grp.querySelector('.rpt-btn.active') || grp.querySelector('.lang-btn.active');
    h.classList.toggle('lit', !!hasActive);
  });
  document.querySelectorAll('.month-hdr').forEach(h => {
    const mGrp = h.closest('.month-group');
    const hasActive = mGrp.querySelector('.lang-btn.active') || mGrp.querySelector('.rpt-btn.active');
    h.classList.toggle('lit', !!hasActive);
  });
  document.querySelectorAll('.date-group').forEach(g => {
    if (g.dataset.date === date) {
      g.classList.add('open');
      // Also open parent month group
      const monthGrp = g.closest('.month-group');
      if (monthGrp) monthGrp.classList.add('open');
    }
  });

  // Rollup (weekly/monthly): highlight active row's month and expand its section
  document.querySelectorAll('.wk-month-hdr').forEach(h => {
    const mGrp = h.closest('.wk-month-group');
    h.classList.toggle('lit', !!mGrp.querySelector('.lang-btn.active'));
  });
  if (isRollupReport(report)) {
    const activeBtn = document.querySelector('.wk-item .lang-btn.active');
    if (activeBtn) {
      const sec = activeBtn.closest('.nav-section');
      if (sec) sec.classList.add('open');
      const wkMonth = activeBtn.closest('.wk-month-group');
      if (wkMonth) wkMonth.classList.add('open');
    }
  }

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');

  const cwrap = document.getElementById('cwrap');
  setContent('<div class="msg"><div class="msg-icon">⏳</div><div>Loading…</div></div>');
  cwrap.scrollTop = 0;

  try {
    const res = await fetch(reportPath(date, report));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.text();
    const safe = renderMarkdown(raw);
    setContent(`<div class="md fade">${safe}</div>`);
    await enhanceFavorites();
    applyPendingFocus();
  } catch (e) {
    setContent(`<div class="msg"><div class="msg-icon">⚠️</div><div>加载失败：${e.message}</div></div>`);
  }
}

function buildDateGroup(date, reports, isFirst) {
  const grp = document.createElement('div');
  grp.className = 'date-group' + (isFirst ? ' open' : '');
  grp.dataset.date = date;

  const hdr = document.createElement('div');
  hdr.className = 'date-hdr';
  // Show only the day part (DD) since month is already in the parent header
  const dayLabel = date.slice(8); // "03" from "2026-04-03"
  const dateText = document.createTextNode(dayLabel + '\u00a0');
  const arrSpan = document.createElement('span');
  arrSpan.className = 'arr';
  arrSpan.textContent = '▶';
  hdr.appendChild(dateText);
  hdr.appendChild(arrSpan);
  hdr.onclick = () => grp.classList.toggle('open');

  const list = document.createElement('div');
  list.className = 'rpt-list';

  const baseReports = reports.filter(r => !r.endsWith('-en'));
  baseReports.forEach(r => {
    const enKey = r + '-en';
    const hasEn = reports.includes(enKey);

    if (hasEn) {
      const row = document.createElement('div');
      row.className = 'rpt-row';

      const label = document.createElement('span');
      label.className = 'rpt-label';
      const baseLabel = LABELS[r] || r;
      label.textContent = baseLabel;
      label.title = baseLabel;

      const btns = document.createElement('div');
      btns.className = 'lang-btns';

      const zhBtn = document.createElement('button');
      zhBtn.className = 'lang-btn';
      zhBtn.dataset.key = `${date}/${r}`;
      zhBtn.textContent = 'ZH';
      zhBtn.onclick = () => loadReport(date, r);

      const enBtn = document.createElement('button');
      enBtn.className = 'lang-btn';
      enBtn.dataset.key = `${date}/${enKey}`;
      enBtn.textContent = 'EN';
      enBtn.onclick = () => loadReport(date, enKey);

      btns.append(zhBtn, enBtn);
      row.append(label, btns);
      list.appendChild(row);
    } else {
      const btn = document.createElement('button');
      btn.className = 'rpt-btn';
      btn.dataset.key = `${date}/${r}`;
      btn.textContent = LABELS[r] || r;
      btn.onclick = () => loadReport(date, r);
      list.appendChild(btn);
    }
  });

  grp.append(hdr, list);
  return grp;
}

const ROLLUP_REPORTS = ['ai-weekly', 'ai-weekly-en', 'ai-monthly', 'ai-monthly-en'];

// ISO week number for a Monday date string — mirrors toWeekStr() in src/rollup.ts.
function isoWeek(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + 4 - (dt.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  return Math.ceil(((dt - yearStart) / 86400000 + 1) / 7);
}

// Weekly reports are stamped on the Monday they were generated; label shows the
// ISO week plus the Mon–Sun range so each week is unambiguous.
function weekLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const sun = new Date(Date.UTC(y, m - 1, d + 6));
  const mm = String(sun.getUTCMonth() + 1).padStart(2, '0');
  const dd = String(sun.getUTCDate()).padStart(2, '0');
  return `第 ${isoWeek(dateStr)} 周 · ${dateStr.slice(5)} ~ ${mm}-${dd}`;
}

function monthLabel(dateStr) {
  // Monthly report dir is stamped on the 1st of the month *after* the covered month.
  const [y, m] = dateStr.split('-').map(Number);
  const prev = new Date(Date.UTC(y, m - 2, 1));
  return `${prev.getUTCFullYear()}-${String(prev.getUTCMonth() + 1).padStart(2, '0')}`;
}

// One ZH/EN row for a rollup (weekly/monthly) entry. Reuses .lang-btn + dataset.key
// so loadReport()'s highlight sync and favorites cleanup work unchanged.
function buildRollupItem(date, reportKey, labelText) {
  const row = document.createElement('div');
  row.className = 'rpt-row wk-item';
  row.dataset.date = date;

  const label = document.createElement('span');
  label.className = 'rpt-label';
  label.textContent = labelText;
  label.title = labelText;

  const btns = document.createElement('div');
  btns.className = 'lang-btns';
  const enKey = reportKey + '-en';

  const zhBtn = document.createElement('button');
  zhBtn.className = 'lang-btn';
  zhBtn.dataset.key = `${date}/${reportKey}`;
  zhBtn.textContent = 'ZH';
  zhBtn.onclick = () => loadReport(date, reportKey);

  const enBtn = document.createElement('button');
  enBtn.className = 'lang-btn';
  enBtn.dataset.key = `${date}/${enKey}`;
  enBtn.textContent = 'EN';
  enBtn.onclick = () => loadReport(date, enKey);

  btns.append(zhBtn, enBtn);
  row.append(label, btns);
  return row;
}

// A collapsible top-level section (周报 / 月报). Groups entries by month.
function buildRollupSection(title, reportKey, dates, labelFn) {
  const entries = dates.filter((e) => e.reports.includes(reportKey));
  if (!entries.length) return null;

  const section = document.createElement('div');
  section.className = `nav-section ${reportKey === 'ai-weekly' ? 'weekly' : 'monthly'}-section`;

  const sHdr = document.createElement('div');
  sHdr.className = 'nav-section-hdr';
  sHdr.append(document.createTextNode(title + ' '));
  const sArr = document.createElement('span');
  sArr.className = 'arr';
  sArr.textContent = '▶';
  sHdr.appendChild(sArr);
  sHdr.onclick = () => section.classList.toggle('open');

  const sBody = document.createElement('div');
  sBody.className = 'nav-section-body';

  const months = new Map();
  entries.forEach((e) => {
    const month = e.date.slice(0, 7);
    if (!months.has(month)) months.set(month, []);
    months.get(month).push(e);
  });

  months.forEach((monthEntries, month) => {
    const mGrp = document.createElement('div');
    mGrp.className = 'wk-month-group open';

    const mHdr = document.createElement('div');
    mHdr.className = 'wk-month-hdr';
    mHdr.append(document.createTextNode(month + ' '));
    const mArr = document.createElement('span');
    mArr.className = 'arr';
    mArr.textContent = '▶';
    mHdr.appendChild(mArr);
    mHdr.onclick = () => mGrp.classList.toggle('open');

    const mBody = document.createElement('div');
    mBody.className = 'wk-month-body';
    monthEntries.forEach((e) => mBody.appendChild(buildRollupItem(e.date, reportKey, labelFn(e.date))));

    mGrp.append(mHdr, mBody);
    sBody.appendChild(mGrp);
  });

  section.append(sHdr, sBody);
  return section;
}

function buildNav(dates) {
  const nav = document.getElementById('nav');

  // ── Daily section: existing month → day tree, with rollup reports filtered out ──
  const daily = document.createElement('div');
  daily.className = 'nav-section daily-section open';
  const dHdr = document.createElement('div');
  dHdr.className = 'nav-section-hdr';
  dHdr.append(document.createTextNode('日报 '));
  const dArr = document.createElement('span');
  dArr.className = 'arr';
  dArr.textContent = '▶';
  dHdr.appendChild(dArr);
  dHdr.onclick = () => daily.classList.toggle('open');
  const dBody = document.createElement('div');
  dBody.className = 'nav-section-body';

  // Group dates by month (YYYY-MM), excluding rollup reports
  const months = new Map();
  dates.forEach((entry) => {
    const reports = entry.reports.filter((r) => !ROLLUP_REPORTS.includes(r));
    if (!reports.length) return; // skip days that only carry a weekly/monthly report
    const month = entry.date.slice(0, 7); // "2026-04"
    if (!months.has(month)) months.set(month, []);
    months.get(month).push({ date: entry.date, reports });
  });

  let isFirstDate = true;
  let isFirstMonth = true;
  months.forEach((entries, month) => {
    const mGrp = document.createElement('div');
    mGrp.className = 'month-group' + (isFirstMonth ? ' open' : '');

    const mHdr = document.createElement('div');
    mHdr.className = 'month-hdr';
    const mText = document.createTextNode(month + '\u00a0');
    const mArr = document.createElement('span');
    mArr.className = 'arr';
    mArr.textContent = '▶';
    mHdr.appendChild(mText);
    mHdr.appendChild(mArr);
    mHdr.onclick = () => mGrp.classList.toggle('open');

    const mBody = document.createElement('div');
    mBody.className = 'month-body';

    entries.forEach(({ date, reports }) => {
      mBody.appendChild(buildDateGroup(date, reports, isFirstDate));
      isFirstDate = false;
    });

    mGrp.append(mHdr, mBody);
    dBody.appendChild(mGrp);
    isFirstMonth = false;
  });
  daily.append(dHdr, dBody);
  nav.appendChild(daily);

  // Weekly & Monthly sections (collapsed by default)
  const weekly = buildRollupSection('周报', 'ai-weekly', dates, weekLabel);
  if (weekly) nav.appendChild(weekly);
  const monthly = buildRollupSection('月报', 'ai-monthly', dates, monthLabel);
  if (monthly) nav.appendChild(monthly);
}

window.addEventListener('popstate', () => { void handleRoute(); });

// ── Init ──
(async () => {
  consumeBridgeToken();
  updateBridgeButtons();
  await loadFavorites();
  renderFavNav();
  setupSelectionFavorites();
  // Flush pending favorites on tab hide / close (keepalive survives unload).
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') favSyncBeacon(); });
  window.addEventListener('pagehide', favSyncBeacon);
  await refreshBridgeStatus(true);

  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');

    manifestDates = dates;
    buildNav(dates);
    await handleRoute();
  } catch (e) {
    document.getElementById('nav').innerHTML =
      '<div class="msg" style="height:80px;font-size:10px">⚠️ ' + e.message + '</div>';
    setContent('<div class="msg"><div class="msg-icon">📡</div><div>无法加载 manifest.json</div></div>');
  }
})();
</script>
</body>
</html>
