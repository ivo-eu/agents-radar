name: Monthly Agents Radar

on:
  schedule:
    # 每月 1 日 00:30 UTC = 08:30 北京时间。月报汇总上一整月(代码按 prevMonth 月份过滤)，
    # 与「当天日报是否已生成」无关，故无歧义；放在 1 日凌晨即可。
    - cron: "30 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agents-radar-publish
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_STREAM: "true"
      DIGEST_REPO: ${{ github.repository }}
      PUBLISH_ISSUES: "false"
      PAGES_URL: https://ivo-eu.github.io/agents-radar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run monthly rollup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm monthly

      - name: Commit monthly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No monthly report to commit"
          else
            MONTH=$(date -u +%Y-%m)
            HUSKY=0 git commit -m "digest: ${MONTH} monthly digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json sync-manifest.json feed.xml search-index/
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "chore: update web indexes"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
        run: pnpm notify
